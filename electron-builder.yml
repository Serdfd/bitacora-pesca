appId: com.bitacora.pesca
productName: Bitacora de Pesca

directories:
  output: release
  buildResources: assets

files:
  - dist
  - dist-electron
  - node_modules/better-sqlite3/**/*
  - "!node_modules/better-sqlite3/build/Release/*.pdb"
  - "!src/**/*"
  - "!electron/**/*"
  - "!*.ts"
  - "!*.md"

win:
  icon: assets/icon.ico
  target:
    - target: portable
      arch: [x64]

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3/**/*"

npmRebuild: true